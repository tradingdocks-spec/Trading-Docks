<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Docks — Homepage review</title><style>body{margin:0;background:#101213;color:#e8eeee;font:15px system-ui}header{padding:24px;position:sticky;top:0;background:#101213f5;border-bottom:1px solid #ffffff22}h1{font-size:20px;margin:0 0 8px}p{color:#aab8bb;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 16px;color:#c9d9d8;background:#202828;border:1px solid #506260;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#92dfd4;color:#132623}main{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}h2{font-size:14px}img{width:100%;height:auto;border:1px solid #ffffff20}a{color:#92dfd4}@media(max-width:700px){main{padding:10px;gap:10px}}</style><header><h1>Trading Docks · Homepage design review</h1><p>Live homepage before / local production build after. Example product data; no deployment.</p><nav aria-label="Screenshot viewport"></nav></header><main><section><h2>Before · Live site</h2><a id="beforeLink"><img id="before" alt="Homepage before redesign"></a></section><section><h2>After · Local build</h2><a id="afterLink"><img id="after" alt="Homepage after redesign"></a></section></main><script>const nav=document.querySelector('nav');for(const width of [1728,1440,1024,768,390]){const b=document.createElement('button');b.textContent=width+' px';b.onclick=()=>select(width);b.dataset.width=width;nav.append(b)}function select(width){for(const b of nav.children)b.setAttribute('aria-pressed',String(+b.dataset.width===width));for(const side of ['before','after']){const file='homepage-'+side+'-'+width+'.png';document.getElementById(side).src=file;document.getElementById(side+'Link').href=file}}select(1440);</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Docks · Theme review</title><style>body{margin:0;background:#101314;color:#edf2f1;font:15px system-ui}header{position:sticky;top:0;padding:18px 24px;background:#1a2021;display:flex;align-items:center;flex-wrap:wrap;gap:18px;border-bottom:1px solid #344340}h1{font-size:18px;margin:0}label{display:flex;gap:8px;align-items:center}select{padding:9px;background:#222a2b;color:#edf2f1;border:1px solid #526963;border-radius:8px}p{color:#becac8;margin:14px 24px}main{padding:0 24px 24px;display:flex;justify-content:center}img{max-width:100%;height:auto;border-radius:12px;border:1px solid #344340}</style><header><h1>Trading Docks · Theme review</h1><label>Page <select id="route"><option>home</option><option>pricing</option><option>sign-in</option><option>sign-up</option><option>forgot-password</option><option>privacy</option><option>workspace</option><option>dialog</option></select></label><label>Theme <select id="theme"><option>dark</option><option>light</option></select></label><label>Width <select id="width"><option>1440</option><option>390</option></select></label></header><p id="note">Local production render. Workspace and dialog images use isolated shared components with example data.</p><main><img id="preview" alt="Selected Trading Docks page and theme"></main><script>const ids=['route','theme','width'];function update(){const [r,t,w]=ids.map(id=>document.getElementById(id).value);document.getElementById('preview').src=r==='workspace'||r==='dialog'?'theme-'+r+'-'+t+'-'+w+'.png':'theme-'+t+'-'+r+'-'+w+'.png';}ids.forEach(id=>document.getElementById(id).onchange=update);update();</script></html>
